default:
  tags:
    - seng426

stages:
  - build
  - docker

variables:
  DOCKER_DRIVER: overlay2

# ------------------------
# Backend Build
# ------------------------
backend_build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd vega-spring
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - vega-spring/target/*.jar
  only:
    - main

# ------------------------
# Frontend Build
# ------------------------
frontend_build:
  stage: build
  image: node:16
  script:
    - cd vega-web
    - npm install
    - CI=false npm run build
  artifacts:
    paths:
      - vega-web/build/
  only:
    - main

# ------------------------
# Docker Build & Push
# ------------------------
docker_build:
  stage: docker
  image: docker:latest
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - docker build -t eafolaranmi/vega_back:latest vega-spring
    - docker push eafolaranmi/vega_back:latest
    - docker build -t eafolaranmi/vega_front:latest vega-web
    - docker push eafolaranmi/vega_front:latest

# ------------------------
# Nightly Selenium Tests
# ------------------------
selenium_tests:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  before_script:
    # Install Chrome and ChromeDriver
    - apt-get update -qq
    - apt-get install -y -qq wget gnupg unzip curl
    - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq
    - apt-get install -y -qq google-chrome-stable
    # Pull and start the app via Docker Compose
    - apt-get install -y -qq docker-compose
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
    - docker-compose -f docker-compose-cd.yml up -d
    - sleep 30  # wait for backend and DB to be ready
  script:
    - cd testing
    - mvn test -Dsurefire.excludedGroups="requiresVM"
  after_script:
    - docker-compose -f docker-compose-cd.yml down
  artifacts:
    when: always
    paths:
      - testing/target/surefire-reports/
    reports:
      junit: testing/target/surefire-reports/junitreports/TEST-*.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual